name: Produzir media

on:
  push:
    branches: [main]
    paths: ["pedido.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright==1.47.0 pillow
          python -m playwright install --with-deps chromium
      - name: Produzir os meses pedidos em pedido.txt
        run: |
          for m in $(grep -oE '[0-9]{4}-[0-9]{2}' pedido.txt | sort -u); do
            echo "== $m"; python engine/render.py "$m"
          done
      - name: Guardar media
        run: |
          git config user.name "nne-bot"
          git config user.email "nne-bot@users.noreply.github.com"
          git add media
          git diff --cached --quiet && echo "Sem alteracoes" && exit 0
          git commit -m "media: $(tr '\n' ' ' < pedido.txt)"
          git pull --rebase origin main
          git push
